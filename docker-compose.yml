services:
  motortown:
    image: ghcr.io/benfugate/motortowndedi:latest
    # Uncomment to build locally instead of pulling the published image.
    # build:
    #   context: .
    container_name: ${CONTAINER_NAME:-motortown}
    restart: unless-stopped
    # Host networking, not bridge. On bridge the server advertises the container's internal
    # address in its session URL ("172.17.0.x:7777"), which no client can reach.
    network_mode: host
    stop_grace_period: 150s  # must exceed SHUTDOWN_TIMEOUT so the world gets written
    environment:
      STEAM_USERNAME: ${STEAM_USERNAME}
      STEAM_PASSWORD: ${STEAM_PASSWORD:-}
      STEAM_BRANCH: ${STEAM_BRANCH:-beta}
      STEAM_BETA_PASSWORD: ${STEAM_BETA_PASSWORD:-}
      VALIDATE: ${VALIDATE:-false}
      SERVER_PARAMS: ${SERVER_PARAMS:-Jeju_World?listen? -server -useperfthreads}
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      UMASK: ${UMASK:-000}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-120}
    volumes:
      # The server install, which is also where DedicatedServerConfig.json and
      # MotorTown/Saved/SaveGames live. This is the one that must be backed up.
      - ${APPDATA:-/mnt/user/appdata/motortown}/serverfiles:/serverdata/serverfiles
      # steamcmd itself.
      - ${APPDATA:-/mnt/user/appdata/motortown}/steamcmd:/serverdata/steamcmd
      # Cached Steam login (so Steam Guard is answered once) and the Proton prefix.
      - ${APPDATA:-/mnt/user/appdata/motortown}/Steam:/serverdata/Steam
    labels:
      - "net.unraid.docker.icon=${ICON_URL:-https://raw.githubusercontent.com/benfugate/motortowndedi/main/motortown.png}"
