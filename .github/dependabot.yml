version: 2
updates:
  # Base image digest only. Auto-merged by ci.yml once the smoke test passes, so a Debian
  # security bump ships without a human. The tag stays at 13-slim: a Debian major jump is a
  # deliberate change, and the base version is load-bearing here (GE-Proton11 needs the
  # glibc 2.38+ that trixie provides).
  #
  # Note this does NOT track the server itself. The game is downloaded by steamcmd on every
  # container start, so it updates on a restart with no image rebuild. Proton is pinned by the
  # GE_PROTON_VERSION build arg and is not a Dependabot ecosystem either — bump it by hand.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
      timezone: "America/New_York"
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "debian"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
