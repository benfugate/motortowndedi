name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck the entrypoint scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: motortowndedi:test
          platforms: linux/amd64
          cache-from: type=gha,scope=main
          cache-to: type=gha,mode=max,scope=main

      # There is nothing to unit test — the server is downloaded at runtime — so this checks
      # the things that actually break: Wine missing from the image, a script with a syntax
      # error, or steamcmd's dependencies not installed.
      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint bash motortowndedi:test -c '
            set -eux
            wine --version
            test -s /etc/machine-id
            for s in /opt/scripts/*.sh; do bash -n "$s"; done
            id steam
            ldconfig -p | grep -q libfreetype
          '

  automerge:
    # Base-image digest bumps merge once the checks pass; Actions bumps wait for a human.
    if: github.actor == 'dependabot[bot]'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and publish
        if: steps.meta.outputs.package-ecosystem == 'docker'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR_URL" --squash --match-head-commit "$HEAD_SHA"
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
